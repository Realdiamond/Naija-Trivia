name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whosabi
          POSTGRES_PASSWORD: whosabi
          POSTGRES_DB: whosabi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U whosabi" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Integration tests create and drop their own throwaway databases with this login.
      TEST_PG_ADMIN_URL: postgres://whosabi:whosabi@localhost:5432/whosabi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app for the end-to-end tests
        run: pnpm --filter @whosabi/app build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3100
          EXPO_PUBLIC_EVENTS_URL: http://localhost:3101
      - name: Build the light party client for the end-to-end tests
        run: pnpm --filter @whosabi/web-guest build
        env:
          VITE_API_URL: http://localhost:3100
      - run: pnpm --filter @whosabi/app exec playwright install --with-deps chromium
      - name: End-to-end tests (the web app against the API)
        run: pnpm --filter @whosabi/app e2e
      - name: Build the admin console
        run: pnpm --filter @whosabi/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: End-to-end tests (the admin console against the API and worker)
        run: pnpm --filter @whosabi/admin e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/app/e2e/.output
            apps/admin/e2e/.output
          retention-days: 7
