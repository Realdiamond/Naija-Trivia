# Local development services (TRD §7 `local` environment).
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whosabi
      POSTGRES_PASSWORD: whosabi
      POSTGRES_DB: whosabi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'whosabi']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: whosabi
      CLICKHOUSE_PASSWORD: whosabi
      CLICKHOUSE_DB: analytics
    ports:
      - '8123:8123'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  pgdata: {}
