<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 16px 10px; box-sizing: border-box">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">Leaderboards</h1>
      <p style="margin: 0; font-size: 13px; font-weight: 800; color: #5A6660">Resets Monday</p>
    </div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F3EEE1">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{showStates}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #FFF1E3; font-size: 14px; font-weight: 800">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: #A84300; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M9 20h6"></path></svg>
        Top states today: 1 Anambra · 2 Lagos · 3 Oyo
      </div>
    </sc-if>

    <ol style="list-style: none; margin: 10px 0 0; padding: 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <li style="{{r.row}}">
          <span style="{{r.rankStyle}}">{{r.rank}}</span>
          <span aria-hidden="true" style="{{r.avatar}}">{{r.initial}}</span>
          <div style="flex: 1; min-width: 0">
            <p style="margin: 0; font-size: 15px; font-weight: 800">{{r.name}}</p>
            <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5A6660">{{r.tier}}</p>
          </div>
          <span style="font-size: 15px; font-weight: 800">{{r.pts}}</span>
        </li>
      </sc-for>
    </ol>

    <sc-if value="{{showMe}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #E3F3EA; border: 2px solid #008751">
        <span style="width: 48px; font-size: 14px; font-weight: 800">{{meRank}}</span>
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #008751; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">T</span>
        <div style="flex: 1">
          <p style="margin: 0; font-size: 15px; font-weight: 800">You (ToluSabi)</p>
          <p style="margin: 0; font-size: 12px; font-weight: 700; color: #3F4A44">Oga · 1,734</p>
        </div>
        <span style="font-size: 15px; font-weight: 800">4,310</span>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; height: 72px; border-top: 1px solid #E8E2D2; background: #FFFFFF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a href="Play.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l5.5 3.5-5.5 3.5z"></path></svg></span>Play</a>
    <a href="Leagues.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #006B40; font-size: 12px; font-weight: 800">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; background: #E3F3EA"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"></path><path d="M12 13v4M9 20h6"></path></svg></span>Leagues</a>
    <a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg></span>Shop</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (this.state && this.state.tab) || 'friends';
    const on = 'height: 42px; border: 0; border-radius: 9px; background: #FFFFFF; color: #14231B; font: 800 15px Nunito, system-ui, sans-serif; box-shadow: 0 1px 2px rgba(20,35,27,0.12); cursor: pointer';
    const off = 'height: 42px; border: 0; border-radius: 9px; background: transparent; color: #3F4A44; font: 700 15px Nunito, system-ui, sans-serif; cursor: pointer';
    const colors = ['#8E44AD', '#008751', '#1F5F8B', '#C0392B', '#7A5A1E', '#14231B', '#16806B'];
    const data = {
      friends: [
        ['NgoziVibes', 'Chairman', '4,820'], ['ToluSabi (you)', 'Oga', '4,310'], ['ChidiOfLagos', 'Oga', '3,980'],
        ['KemiCooks', 'Oga', '3,450'], ['FemiTheGreat', 'Learner', '2,900'], ['AishaReads', 'Learner', '2,210'], ['BigBolu', 'JJC', '1,120']
      ],
      lagos: [
        ['LekkiLaurel', 'Chairman', '9,880'], ['YabaTechie', 'Chairman', '9,640'], ['SurulereSabi', 'Oga', '9,410'],
        ['AjegunleAce', 'Oga', '9,120'], ['VI_Vibes', 'Chairman', '8,990'], ['IkejaQuiz', 'Oga', '8,760'], ['EpeEagle', 'Oga', '8,540']
      ],
      naija: [
        ['EnuguEagle', 'Chairman', '12,440'], ['KanoQuiz', 'Chairman', '12,100'], ['PHCityPro', 'Chairman', '11,870'],
        ['AbaAce', 'Oga', '11,500'], ['IbadanIQ', 'Chairman', '11,240'], ['JosJollof', 'Oga', '11,010'], ['CalabarCool', 'Oga', '10,880']
      ]
    };
    const rowBase = 'display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; ';
    const rows = data[tab].map((r, i) => {
      const me = r[0].indexOf('(you)') !== -1;
      return {
        rank: i + 1,
        name: r[0],
        tier: r[1],
        pts: r[2],
        initial: r[0].charAt(0),
        row: rowBase + (me ? 'background: #E3F3EA' : 'background: transparent'),
        rankStyle: 'width: 26px; font-size: 16px; font-weight: 800; color: ' + (i < 3 ? '#A84300' : '#5A6660'),
        avatar: 'width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 800; background: ' + (me ? '#008751' : colors[i % colors.length])
      };
    });
    return {
      tabs: [
        { id: 'friends', label: 'Friends' },
        { id: 'lagos', label: 'Lagos' },
        { id: 'naija', label: 'All Naija' }
      ].map((t) => ({ label: t.label, on: t.id === tab, style: t.id === tab ? on : off, pick: () => this.setState({ tab: t.id }) })),
      rows,
      showStates: tab !== 'friends',
      showMe: tab !== 'friends',
      meRank: tab === 'lagos' ? '#214' : '#3,902'
    };
  }
}
</script>
</body>
</html>
