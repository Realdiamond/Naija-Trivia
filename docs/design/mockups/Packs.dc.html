<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice packs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 10px 16px 18px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px">
    <a href="Play.dc.html" aria-label="Back" style="width: 48px; height: 48px; margin-left: -8px; display: flex; align-items: center; justify-content: center; color: #14231B">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px">Practice packs</h1>
  </div>
  <p style="margin: 2px 0 0 4px; font-size: 14px; line-height: 1.45; font-weight: 600; color: #3F4A44">Downloaded packs play with no network. You earn XP, and your rating doesn’t change.</p>

  <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #F3EEE1">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: #3F4A44; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
    <div style="flex: 1">
      <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E3DCCB; overflow: hidden"><div style="width: 40%; height: 100%; background: #008751"></div></div>
      <p style="margin: 4px 0 0; font-size: 13px; font-weight: 700; color: #3F4A44">12 MB of 30 MB used on this phone</p>
    </div>
  </div>

  <ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{packs}}" as="p" hint-placeholder-count="5">
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D2">
        <div aria-hidden="true" style="{{p.cover}}">
          <span style="{{p.mark1}}"></span>
          <span style="{{p.mark2}}"></span>
        </div>
        <div style="flex: 1; min-width: 0">
          <p style="margin: 0; font-size: 16px; font-weight: 800">{{p.name}}</p>
          <p style="margin: 2px 0 0; font-size: 13px; font-weight: 700; color: #5A6660">{{p.meta}}</p>
          <p style="{{p.statusStyle}}">{{p.status}}</p>
        </div>
        <sc-if value="{{p.playable}}" hint-placeholder-val="{{ true }}">
          <a href="Question.dc.html" style="display: flex; align-items: center; justify-content: center; width: 84px; height: 44px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 15px; text-decoration: none">Play</a>
        </sc-if>
        <sc-if value="{{p.downloadable}}" hint-placeholder-val="{{ false }}">
          <button type="button" style="width: 84px; height: 44px; border-radius: 12px; border: 2px solid #008751; background: #FFFFFF; color: #006B40; font: 800 15px Nunito, system-ui, sans-serif; cursor: pointer">Get it</button>
        </sc-if>
        <sc-if value="{{p.locked}}" hint-placeholder-val="{{ false }}">
          <a href="Shop.dc.html" style="display: flex; align-items: center; justify-content: center; width: 84px; height: 44px; border-radius: 12px; background: #FF7A00; color: #14231B; font-weight: 800; font-size: 15px; text-decoration: none">Unlock</a>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: #5A6660; text-align: center">Core packs are free. Premium packs cost 300 to 600 coins, or come with the Sabi Pass.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cover = (bg) => 'position: relative; width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; overflow: hidden; background: ' + bg;
    const m1 = (c) => 'position: absolute; right: -10px; top: -10px; width: 36px; height: 36px; border-radius: 50%; background: ' + c;
    const m2 = (c) => 'position: absolute; left: 10px; bottom: 10px; width: 16px; height: 16px; transform: rotate(45deg); background: ' + c;
    const ok = 'margin: 3px 0 0; font-size: 12px; font-weight: 800; color: #0B6B33';
    const plain = 'margin: 3px 0 0; font-size: 12px; font-weight: 800; color: #5A6660';
    const prem = 'margin: 3px 0 0; font-size: 12px; font-weight: 800; color: #A84300';
    const packs = [
      { name: 'Pidgin 101', meta: 'Slang · 50 questions', status: 'Downloaded · works offline', statusStyle: ok, kind: 'play', bg: '#8E44AD', a: '#FF7A00', b: '#FFFDF7' },
      { name: 'Owambe Starter Pack', meta: 'Food and culture · 50 questions', status: 'Downloaded · works offline', statusStyle: ok, kind: 'play', bg: '#C0392B', a: '#FFB547', b: '#FFFDF7' },
      { name: 'Lagos Traffic Wahala', meta: 'Mixed Naija · 50 questions', status: 'Free · 1.2 MB', statusStyle: plain, kind: 'get', bg: '#16A085', a: '#14231B', b: '#FFB547' },
      { name: 'Funke Akindele Universe', meta: 'Nollywood · 120 questions', status: '400 coins or Sabi Pass', statusStyle: prem, kind: 'lock', bg: '#E67E22', a: '#14231B', b: '#FFFDF7' },
      { name: 'Afrobeats Legends', meta: 'Music · 150 questions', status: '300 coins or Sabi Pass', statusStyle: prem, kind: 'lock', bg: '#2980B9', a: '#FFB547', b: '#FFFDF7' }
    ];
    return {
      packs: packs.map((p) => ({
        name: p.name,
        meta: p.meta,
        status: p.status,
        statusStyle: p.statusStyle,
        playable: p.kind === 'play',
        downloadable: p.kind === 'get',
        locked: p.kind === 'lock',
        cover: cover(p.bg),
        mark1: m1(p.a),
        mark2: m2(p.b)
      }))
    };
  }
}
</script>
</body>
</html>
