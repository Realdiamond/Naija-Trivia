<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 16px 0; box-sizing: border-box">
    <div style="display: flex; justify-content: flex-end; gap: 4px">
      <button type="button" aria-label="Share profile" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: #14231B; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>
      </button>
      <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14231B">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 50%; background: #008751; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border: 3px solid #FF7A00; flex-shrink: 0">
        <svg viewBox="0 0 40 40" width="64" height="64" style="fill: #FFFDF7"><circle cx="20" cy="16" r="7"></circle><path d="M7 38c1.5-8 7-12 13-12s11.5 4 13 12z"></path></svg>
      </span>
      <div>
        <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05">ToluSabi</h1>
        <p style="margin: 3px 0 0; font-size: 14px; font-weight: 700; color: #5A6660">Lagos · playing since October 2026</p>
        <a href="Friends.dc.html" style="display: inline-block; margin-top: 4px; font-size: 14px; font-weight: 800">23 friends</a>
      </div>
    </div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 12px; border-radius: 16px; background: #14231B; color: #FFFFFF">
        <p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: #FFB547; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 3h6l-1.5 3 2.5 9-4 5-4-5 2.5-9z"></path></svg>
          Oga · 1,734</p>
        <div aria-hidden="true" style="margin-top: 8px; height: 8px; border-radius: 4px; background: #2C4136; overflow: hidden"><div style="width: 17%; height: 100%; background: #FFB547"></div></div>
        <p style="margin: 6px 0 0; font-size: 12px; font-weight: 700">Chairman at 1,900</p>
      </div>
      <div style="padding: 12px; border-radius: 16px; background: #E3F3EA">
        <p style="margin: 0; font-size: 18px; font-weight: 800">Level 7</p>
        <div aria-hidden="true" style="margin-top: 8px; height: 8px; border-radius: 4px; background: #C8E4D3; overflow: hidden"><div style="width: 41%; height: 100%; background: #008751"></div></div>
        <p style="margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #3F4A44">1,240 of 3,049 XP</p>
      </div>
    </div>

    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
      <div style="padding: 10px 4px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E8E2D2">
        <p style="margin: 0; font-size: 20px; font-weight: 800">48</p>
        <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5A6660">duels</p>
      </div>
      <div style="padding: 10px 4px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E8E2D2">
        <p style="margin: 0; font-size: 20px; font-weight: 800">65%</p>
        <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5A6660">won (31)</p>
      </div>
      <div style="padding: 10px 4px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E8E2D2">
        <p style="margin: 0; font-size: 20px; font-weight: 800">12</p>
        <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5A6660">Daily streak</p>
      </div>
    </div>

    <h2 style="margin: 16px 0 6px; font-size: 16px; font-weight: 800">Right answers by category</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <li style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; align-items: center; gap: 10px">
          <span style="font-size: 14px; font-weight: 700">{{c.name}}</span>
          <span aria-hidden="true" style="height: 10px; border-radius: 5px; background: #ECE6D6; overflow: hidden"><span style="{{c.bar}}"></span></span>
          <span style="font-size: 14px; font-weight: 800; text-align: right">{{c.pct}}</span>
        </li>
      </sc-for>
    </ul>

    <h2 style="margin: 16px 0 8px; font-size: 16px; font-weight: 800">Badges</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="4">
        <span style="{{b.style}}">{{b.name}}</span>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; height: 72px; border-top: 1px solid #E8E2D2; background: #FFFFFF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a href="Play.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l5.5 3.5-5.5 3.5z"></path></svg></span>Play</a>
    <a href="Leagues.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"></path><path d="M12 13v4M9 20h6"></path></svg></span>Leagues</a>
    <a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6660; font-size: 12px; font-weight: 700">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg></span>Shop</a>
    <a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #006B40; font-size: 12px; font-weight: 800">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; background: #E3F3EA"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bar = (pct, c) => 'display: block; height: 100%; border-radius: 5px; width: ' + pct + '%; background: ' + c;
    const cats = [
      ['Food', 88, '#C0392B'], ['Slang & Pidgin', 82, '#8E44AD'], ['Nollywood', 74, '#E67E22'],
      ['Mixed Naija', 70, '#16A085'], ['Music', 61, '#2980B9']
    ].map((c) => ({ name: c[0], pct: c[1] + '%', bar: bar(c[1], c[2]) }));
    const chip = (bg, fg) => 'display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 800; background: ' + bg + '; color: ' + fg;
    const badges = [
      { name: 'Food Oga', style: chip('#FBE6E3', '#8E2A1F') },
      { name: '12-day streak', style: chip('#FFF1E3', '#7A3A00') },
      { name: 'Party MVP', style: chip('#F2E8F7', '#5E2A73') },
      { name: 'First duel won', style: chip('#E3F3EA', '#0B6B33') }
    ];
    return { cats, badges };
  }
}
</script>
</body>
</html>
