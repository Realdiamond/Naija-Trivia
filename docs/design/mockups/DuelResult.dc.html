<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #008751; color: #FFFFFF; padding: 10px 16px 22px; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="12">
        <span style="{{c}}"></span>
      </sc-for>
    </div>
    <a href="Home.dc.html" aria-label="Close" style="position: relative; width: 48px; height: 48px; margin-left: -8px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="position: relative; text-align: center">
      <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" style="fill: #FFB547; stroke: #14231B; stroke-width: 1.4; stroke-linejoin: round"><path d="M3 8l4.5 4 4.5-7 4.5 7L21 8l-2 11H5z"></path></svg>
      <h1 style="margin: 4px 0 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">You win!</h1>
      <p style="margin: 6px 0 0; font-size: 17px; font-weight: 700">Na you get am today</p>
      <div style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 22px">
        <div>
          <span aria-hidden="true" style="width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: #FFFDF7; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border: 3px solid #FFB547">
            <svg viewBox="0 0 40 40" width="46" height="46" style="fill: #008751"><circle cx="20" cy="16" r="7"></circle><path d="M7 38c1.5-8 7-12 13-12s11.5 4 13 12z"></path></svg>
          </span>
          <p style="margin: 6px 0 0; font-size: 14px; font-weight: 800">You</p>
          <p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1">1,318</p>
        </div>
        <span style="font-weight: 800; font-size: 16px">to</span>
        <div>
          <span aria-hidden="true" style="width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: #C0392B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; border: 3px solid #FFFDF7">F</span>
          <p style="margin: 6px 0 0; font-size: 14px; font-weight: 800">FemiTheGreat</p>
          <p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1">1,204</p>
        </div>
      </div>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 16px 16px 18px; box-sizing: border-box">
    <table style="width: 100%; border-collapse: collapse; font-size: 15px">
      <caption style="text-align: left; font-size: 16px; font-weight: 800; padding-bottom: 6px">Round by round</caption>
      <thead>
        <tr style="color: #5A6660; font-size: 13px">
          <th scope="col" style="text-align: left; font-weight: 800; padding: 6px 0">Round</th>
          <th scope="col" style="text-align: right; font-weight: 800; padding: 6px 0">You</th>
          <th scope="col" style="text-align: right; font-weight: 800; padding: 6px 0">Femi</th>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{rounds}}" as="r" hint-placeholder-count="3">
          <tr style="border-top: 1px solid #EFEADF">
            <th scope="row" style="text-align: left; font-weight: 700; padding: 9px 0">
              <span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="{{r.dot}}"></span>{{r.name}}</span>
            </th>
            <td style="{{r.youStyle}}">{{r.you}}</td>
            <td style="{{r.themStyle}}">{{r.them}}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 8px; border-radius: 12px; background: #E3F3EA; text-align: center">
        <p style="margin: 0; font-size: 20px; font-weight: 800; color: #0B6B33">+14</p>
        <p style="margin: 0; font-size: 12px; font-weight: 800; color: #3F4A44">rating · now 1,734</p>
      </div>
      <div style="padding: 10px 8px; border-radius: 12px; background: #FFF1E3; text-align: center">
        <p style="margin: 0; font-size: 20px; font-weight: 800">+30</p>
        <p style="margin: 0; font-size: 12px; font-weight: 800; color: #3F4A44">coins</p>
      </div>
      <div style="padding: 10px 8px; border-radius: 12px; background: #F2E8F7; text-align: center">
        <p style="margin: 0; font-size: 20px; font-weight: 800">+124</p>
        <p style="margin: 0; font-size: 12px; font-weight: 800; color: #3F4A44">XP</p>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <a href="Category.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M20 11a8 8 0 0 0-14-5L4 8"></path><path d="M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14 5l2-2"></path><path d="M20 20v-4h-4"></path></svg>
        Rematch
      </a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <a href="ShareCard.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; background: #FF7A00; color: #14231B; font-weight: 800; font-size: 16px; text-decoration: none">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>
          Share
        </a>
        <a href="RoundReview.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; border: 2px solid #D9D1BE; box-sizing: border-box; background: #FFFFFF; color: #14231B; font-weight: 800; font-size: 16px; text-decoration: none">Review answers</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width: 10px; height: 10px; border-radius: 50%; background: ' + c;
    const win = 'text-align: right; padding: 9px 0; font-weight: 800; color: #0B6B33';
    const lose = 'text-align: right; padding: 9px 0; font-weight: 700; color: #3F4A44';
    const rounds = [
      { name: 'Music · your pick', color: '#2980B9', you: 452, them: 398 },
      { name: 'Slang · Femi’s pick', color: '#8E44AD', you: 380, them: 420 },
      { name: 'Food · your pick', color: '#C0392B', you: 486, them: 386 }
    ].map((r) => ({
      name: r.name,
      dot: dot(r.color),
      you: r.you,
      them: r.them,
      youStyle: r.you > r.them ? win : lose,
      themStyle: r.them > r.you ? win : lose
    }));
    const spots = [
      [8, 30, '#FFB547', 0], [18, 70, '#FFFDF7', 30], [30, 20, '#FF7A00', 60], [44, 58, '#FFB547', 15],
      [62, 26, '#FFFDF7', 45], [74, 64, '#FF7A00', 75], [86, 18, '#FFB547', 20], [92, 52, '#FFFDF7', 50],
      [12, 88, '#FF7A00', 35], [52, 90, '#FFFDF7', 10], [80, 86, '#FFB547', 65], [36, 82, '#FFB547', 40]
    ];
    const confetti = spots.map((s) => 'position: absolute; left: ' + s[0] + '%; top: ' + s[1] + '%; width: 8px; height: 14px; border-radius: 2px; background: ' + s[2] + '; transform: rotate(' + s[3] + 'deg); opacity: 0.9');
    return { rounds, confetti };
  }
}
</script>
</body>
</html>
