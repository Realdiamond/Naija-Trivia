<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a username, avatar and age</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 20px 22px; overflow: hidden">
  <a href="SignIn.dc.html" aria-label="Back" style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #14231B">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>
  <h1 style="margin: 6px 0 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05">Make it yours</h1>

  <label for="uname" style="margin-top: 20px; font-size: 15px; font-weight: 800">Username</label>
  <div style="margin-top: 8px; display: flex; align-items: center; height: 56px; border-radius: 12px; border: 2px solid #008751; background: #FFFFFF; padding: 0 12px 0 14px; box-sizing: border-box">
    <input id="uname" type="text" value="ToluSabi" aria-describedby="uname-help" style="flex: 1; min-width: 0; border: 0; outline: none; font: 800 18px Nunito, system-ui, sans-serif; color: #14231B; background: transparent">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #0B6B33; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
  </div>
  <p id="uname-help" style="margin: 6px 0 0; font-size: 14px; color: #0B6B33; font-weight: 700">Available. You pick it once, so choose well.</p>

  <fieldset style="border: 0; margin: 20px 0 0; padding: 0; min-width: 0">
    <legend style="padding: 0; margin: 0 0 10px; font-size: 15px; font-weight: 800">Avatar</legend>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{avatars}}" as="a" hint-placeholder-count="6">
        <button type="button" onClick="{{a.pick}}" aria-label="{{a.name}}" aria-pressed="{{a.on}}" style="{{a.ring}}">
          <span aria-hidden="true" style="{{a.face}}">
            <svg viewBox="0 0 40 40" width="34" height="34" style="fill: #FFFDF7"><circle cx="20" cy="16" r="7"></circle><path d="M7 38c1.5-8 7-12 13-12s11.5 4 13 12z"></path></svg>
          </span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 8px 0 0; font-size: 14px; color: #5A6660">{{avatarName}} · more outfits unlock as you level up</p>
  </fieldset>

  <fieldset style="border: 0; margin: 18px 0 0; padding: 0; min-width: 0">
    <legend style="padding: 0; margin: 0 0 10px; font-size: 15px; font-weight: 800">How old are you?</legend>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ages}}" as="g" hint-placeholder-count="3">
        <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button>
      </sc-for>
    </div>
    <div aria-live="polite">
      <sc-if value="{{teen}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: #3F4A44">Family mode stays on, and people can’t find you from their contacts.</p>
      </sc-if>
      <sc-if value="{{child}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: #FFF1E3; font-size: 14px; line-height: 1.4; font-weight: 700">Sorry o! Who Sabi? is for ages 13 and up. Come back when you’re older.</p>
      </sc-if>
    </div>
  </fieldset>

  <label for="state" style="margin-top: 18px; font-size: 15px; font-weight: 800">Home state <span style="font-weight: 600; color: #5A6660">(optional, for state leaderboards)</span></label>
  <select id="state" style="margin-top: 8px; height: 52px; border-radius: 12px; border: 2px solid #D9D1BE; background: #FFFFFF; padding: 0 12px; font: 700 17px Nunito, system-ui, sans-serif; color: #14231B">
    <option>Lagos</option>
    <option>Abia</option>
    <option>Anambra</option>
    <option>Enugu</option>
    <option>FCT Abuja</option>
    <option>Kaduna</option>
    <option>Kano</option>
    <option>Oyo</option>
    <option>Rivers</option>
  </select>

  <div style="margin-top: auto">
    <sc-if value="{{canGo}}" hint-placeholder-val="{{ true }}">
      <a href="FindFriends.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Continue</a>
    </sc-if>
    <sc-if value="{{child}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="width: 100%; height: 56px; border-radius: 12px; border: 0; background: #E3DCCB; color: #3F4A44; font: 800 17px Nunito, system-ui, sans-serif">Continue</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const av = s.avatar === undefined ? 1 : s.avatar;
    const age = s.age || 'adult';
    const looks = [
      { name: 'Gele', color: '#8E44AD' },
      { name: 'Agbada', color: '#008751' },
      { name: 'Super Eagles jersey', color: '#1F5F8B' },
      { name: 'Ankara shirt', color: '#C0392B' },
      { name: 'NYSC khaki', color: '#7A5A1E' },
      { name: 'Danfo cap', color: '#14231B' }
    ];
    const avatars = looks.map((l, i) => ({
      name: l.name,
      on: i === av,
      ring: 'width: 100%; aspect-ratio: 1; padding: 3px; box-sizing: border-box; border-radius: 50%; background: transparent; cursor: pointer; border: 3px solid ' + (i === av ? '#FF7A00' : 'transparent'),
      face: 'width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: ' + l.color,
      pick: () => this.setState({ avatar: i })
    }));
    const on = 'height: 52px; border-radius: 12px; border: 2px solid #008751; background: #E3F3EA; color: #14231B; font: 800 16px Nunito, system-ui, sans-serif; cursor: pointer';
    const off = 'height: 52px; border-radius: 12px; border: 2px solid #D9D1BE; background: #FFFFFF; color: #14231B; font: 700 16px Nunito, system-ui, sans-serif; cursor: pointer';
    const ages = [
      { id: 'child', label: 'Under 13' },
      { id: 'teen', label: '13 to 17' },
      { id: 'adult', label: '18 or over' }
    ].map((g) => ({ label: g.label, on: g.id === age, style: g.id === age ? on : off, pick: () => this.setState({ age: g.id }) }));
    return {
      avatars,
      avatarName: looks[av].name,
      ages,
      teen: age === 'teen',
      child: age === 'child',
      canGo: age !== 'child'
    };
  }
}
</script>
</body>
</html>
