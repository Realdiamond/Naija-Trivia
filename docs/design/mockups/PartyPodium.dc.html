<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Party podium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B6F0C9}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1A14; color: #FFFFFF; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 16px 18px; overflow: hidden; position: relative">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 330px">
    <sc-for list="{{confetti}}" as="c" hint-placeholder-count="14">
      <span style="{{c}}"></span>
    </sc-for>
  </div>
  <div style="position: relative; text-align: center">
    <p style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #FFB547">Game over · Room K7QXM</p>
    <h1 style="margin: 4px 0 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05">NgoziVibes sabi pass!</h1>
  </div>

  <div style="position: relative; margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center">
        <span aria-hidden="true" style="{{p.avatar}}">{{p.initial}}</span>
        <p style="margin: 6px 0 0; font-size: 14px; font-weight: 800; text-align: center">{{p.name}}</p>
        <p style="margin: 0 0 6px; font-size: 14px; font-weight: 800; color: #B8C4BD">{{p.pts}}</p>
        <div style="{{p.block}}">{{p.place}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #2B1F0A; border: 1px solid #FFB547">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="fill: #FFB547; flex-shrink: 0"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
    <div>
      <p style="margin: 0; font-size: 15px; font-weight: 800; color: #FFB547">MVP of the night</p>
      <p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">NgoziVibes · 9 of 10 right · fastest answer 1.2 s</p>
    </div>
  </div>

  <ol start="4" style="position: relative; list-style: none; margin: 12px 0 0; padding: 0">
    <sc-for list="{{rest}}" as="r" hint-placeholder-count="4">
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #22362B">
        <span style="width: 22px; font-size: 15px; font-weight: 800; color: #B8C4BD">{{r.rank}}</span>
        <span style="flex: 1; font-size: 15px; font-weight: 800">{{r.name}}</span>
        <span style="font-size: 13px; font-weight: 700; color: #B8C4BD">{{r.where}}</span>
        <span style="width: 56px; text-align: right; font-size: 15px; font-weight: 800">{{r.pts}}</span>
      </li>
    </sc-for>
  </ol>

  <div style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 54px; border: 0; border-radius: 12px; background: #FF7A00; color: #14231B; font: 800 17px Nunito, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>
      Share podium card
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="PartyLobby.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 16px; text-decoration: none">Play again</a>
      <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; border: 2px solid #B8C4BD; box-sizing: border-box; color: #FFFFFF; font-weight: 800; font-size: 16px; text-decoration: none">Home</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const av = (c, ring) => 'width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 800; font-size: 22px; background: ' + c + '; border: 3px solid ' + ring;
    const block = (h, bg, fg) => 'width: 100%; height: ' + h + 'px; border-radius: 12px 12px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; box-sizing: border-box; font-family: \'Baloo 2\', sans-serif; font-weight: 800; font-size: 32px; background: ' + bg + '; color: ' + fg;
    const podium = [
      { place: '2', name: 'ToluSabi (you)', initial: 'T', pts: '2,236', avatar: av('#008751', '#D9D9D9'), block: block(96, '#2C4136', '#FFFFFF') },
      { place: '1', name: 'NgoziVibes', initial: 'N', pts: '2,410', avatar: av('#8E44AD', '#FFB547'), block: block(132, '#FFB547', '#14231B') },
      { place: '3', name: 'FemiTheGreat', initial: 'F', pts: '1,980', avatar: av('#C0392B', '#C98A4B'), block: block(72, '#22362B', '#FFFFFF') }
    ];
    const rest = [
      { rank: 4, name: 'ChidiOfLagos', where: 'App', pts: '1,950' },
      { rank: 5, name: 'Uncle B', where: 'Web guest', pts: '1,640' },
      { rank: 6, name: 'AishaReads', where: 'App', pts: '1,388' },
      { rank: 7, name: 'Dami', where: 'Web guest', pts: '1,102' }
    ];
    const spots = [
      [6, 12, '#FFB547', 10], [16, 40, '#FF7A00', 50], [26, 8, '#1DB954', 25], [38, 30, '#FFFDF7', 70],
      [50, 6, '#FFB547', 40], [60, 34, '#FF7A00', 15], [70, 14, '#1DB954', 60], [80, 38, '#FFFDF7', 30],
      [90, 10, '#FFB547', 80], [10, 62, '#1DB954', 35], [32, 58, '#FFB547', 5], [56, 60, '#FF7A00', 45],
      [76, 64, '#FFFDF7', 20], [94, 52, '#FF7A00', 65]
    ];
    const confetti = spots.map((s) => 'position: absolute; left: ' + s[0] + '%; top: ' + s[1] + '%; width: 7px; height: 13px; border-radius: 2px; background: ' + s[2] + '; transform: rotate(' + s[3] + 'deg); opacity: 0.85');
    return { podium, rest, confetti };
  }
}
</script>
</body>
</html>
