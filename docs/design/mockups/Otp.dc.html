<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter your phone code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 20px 24px; overflow: hidden">
  <a href="SignIn.dc.html" aria-label="Back" style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #14231B">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>
  <h1 style="margin: 14px 0 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05">Enter the code</h1>
  <p style="margin: 8px 0 0; font-size: 16px; line-height: 1.45; color: #3F4A44">We sent 6 digits to <strong style="color: #14231B">0803 123 4567</strong>. <a href="SignIn.dc.html" style="font-weight: 800">Change number</a></p>

  <fieldset style="border: 0; margin: 30px 0 0; padding: 0; min-width: 0">
    <legend style="padding: 0; margin: 0 0 10px; font-size: 15px; font-weight: 800">6-digit code</legend>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="{{d.label}}" value="{{d.v}}" style="width: 100%; height: 60px; box-sizing: border-box; border-radius: 12px; border: 2px solid #008751; background: #FFFFFF; text-align: center; font: 800 26px Nunito, system-ui, sans-serif; color: #14231B">
      </sc-for>
    </div>
  </fieldset>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #E6F7EC; color: #0B6B33; font-size: 15px; font-weight: 800">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
    Filled in from your SMS
  </div>

  <a href="Username.dc.html" style="margin-top: 20px; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Verify</a>

  <div style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
    <span style="color: #5A6660; font-weight: 600">Didn’t get it?</span>
    <button type="button" disabled style="border: 0; background: transparent; padding: 10px 0; font: 800 15px Nunito, system-ui, sans-serif; color: #5A6660">Send a new code in 0:24</button>
  </div>

  <p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: #5A6660; text-align: center">The code works once, for 5 minutes. You can ask for up to 5 codes a day.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const code = '482917';
    return {
      digits: code.split('').map((v, i) => ({ v, label: 'Digit ' + (i + 1) }))
    };
  }
}
</script>
</body>
</html>
