<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
textarea::placeholder{color:#6B756F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="padding: 0 16px">
    <div style="height: 6px; margin: 0 -16px; background: #E67E22"></div>
    <p style="margin: 22px 0 0; font-size: 16px; font-weight: 800">Round 2/3 · Nollywood</p>
    <p style="margin: 40px 0 0; font-size: 27px; line-height: 1.25; font-weight: 800">Who directed The Wedding Party (2016)?</p>
    <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 58px; border-radius: 12px; border: 2px solid #E3DCCB; background: #FFFFFF"></div>
      <div style="height: 58px; border-radius: 12px; border: 2px solid #E3DCCB; background: #FFFFFF"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(14,26,20,0.55)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="rep-title" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; background: #FFFDF7; padding: 10px 16px 20px">
    <div aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: #D9D1BE; margin: 0 auto 12px"></div>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <div>
        <h1 id="rep-title" style="margin: 0; font-size: 22px; font-weight: 800">Report this question</h1>
        <p style="margin: 4px 0 0; font-size: 14px; font-weight: 600; color: #3F4A44">Who directed The Wedding Party (2016)?</p>
        <fieldset style="border: 0; margin: 14px 0 0; padding: 0; min-width: 0">
          <legend style="padding: 0; margin: 0 0 8px; font-size: 15px; font-weight: 800">What’s wrong?</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
              <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <label for="note" style="display: block; margin-top: 14px; font-size: 15px; font-weight: 800">Tell us more <span style="font-weight: 600; color: #5A6660">(optional)</span></label>
        <textarea id="note" rows="3" placeholder="e.g. The answer changed after the sequel came out" style="margin-top: 8px; width: 100%; box-sizing: border-box; border-radius: 12px; border: 2px solid #D9D1BE; background: #FFFFFF; padding: 10px 12px; font: 600 15px Nunito, system-ui, sans-serif; color: #14231B; resize: none"></textarea>
        <button type="button" onClick="{{send}}" disabled="{{cantSend}}" style="{{sendStyle}}">Send report</button>
        <a href="Question.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; margin-top: 4px; font-weight: 800; font-size: 15px">Cancel</a>
      </div>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="text-align: center; padding: 10px 0 4px">
        <span aria-hidden="true" style="width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: #E6F7EC; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" width="32" height="32" style="fill: none; stroke: #0B6B33; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </span>
        <p style="margin: 12px 0 0; font-size: 22px; font-weight: 800">Thank you! We go check am.</p>
        <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #3F4A44">If our editors confirm it, you get 5 coins (once a day). Points are fixed for everyone who played it.</p>
        <a href="Question.dc.html" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Back to the game</a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const reason = s.reason === undefined ? 'wrong' : s.reason;
    const sent = !!s.sent;
    const on = 'min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #008751; background: #E3F3EA; color: #14231B; font: 800 15px Nunito, system-ui, sans-serif; cursor: pointer';
    const off = 'min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #D9D1BE; background: #FFFFFF; color: #3F4A44; font: 700 15px Nunito, system-ui, sans-serif; cursor: pointer';
    const sendOn = 'margin-top: 14px; width: 100%; height: 54px; border: 0; border-radius: 12px; background: #008751; color: #FFFFFF; font: 800 17px Nunito, system-ui, sans-serif; cursor: pointer';
    const sendOff = 'margin-top: 14px; width: 100%; height: 54px; border: 0; border-radius: 12px; background: #E3DCCB; color: #3F4A44; font: 800 17px Nunito, system-ui, sans-serif';
    return {
      open: !sent,
      sent,
      reasons: [
        { id: 'wrong', label: 'Wrong answer' },
        { id: 'outdated', label: 'Outdated' },
        { id: 'offensive', label: 'Offensive' },
        { id: 'typo', label: 'Typo' },
        { id: 'unfair', label: 'Too hard or unfair' }
      ].map((r) => ({ label: r.label, on: r.id === reason, style: r.id === reason ? on : off, pick: () => this.setState({ reason: r.id }) })),
      cantSend: !reason,
      sendStyle: reason ? sendOn : sendOff,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
