<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taste test result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006B40}a:hover{color:#004F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; color: #14231B; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px 22px; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="width: 120px; height: 120px; border-radius: 50%; background: #008751; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">2/3</span>
      <span style="font-size: 13px; font-weight: 800">correct</span>
    </div>
    <h1 style="margin: 18px 0 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05">You sabi o!</h1>
    <p style="margin: 6px 0 0; font-size: 16px; font-weight: 600; color: #5A6660">344 points · +72 XP on your first try</p>
  </div>

  <ul style="list-style: none; margin: 22px 0 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D2">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <li style="{{r.rowStyle}}">
        <span aria-hidden="true" style="{{r.dot}}"></span>
        <div style="flex: 1; min-width: 0">
          <p style="margin: 0; font-size: 13px; font-weight: 800; color: #5A6660">{{r.cat}}</p>
          <p style="margin: 2px 0 0; font-size: 15px; font-weight: 700; line-height: 1.3">{{r.answer}}</p>
        </div>
        <sc-if value="{{r.ok}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 4px; font-weight: 800; color: #0B6B33"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{r.pts}}</span>
        </sc-if>
        <sc-if value="{{r.bad}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; align-items: center; gap: 4px; font-weight: 800; color: #B3191C"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round"><path d="M7 7l10 10M17 7L7 17"></path></svg>{{r.pts}}</span>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <div style="margin-top: auto; border-radius: 16px; background: #FFF1E3; padding: 18px 16px 16px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 800">Save your progress</h2>
    <p style="margin: 4px 0 0; font-size: 15px; line-height: 1.4; color: #3F4A44">Keep your points, streak and duels on any phone or browser.</p>
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
      <a href="SignIn.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 12px; background: #008751; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18h2"></path></svg>
        Continue with phone number
      </a>
      <a href="Username.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 12px; background: #FFFFFF; border: 2px solid #D9D1BE; box-sizing: border-box; color: #14231B; font-weight: 800; font-size: 17px; text-decoration: none">Continue with Google</a>
      <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #006B40; font-weight: 800; font-size: 16px">Later, play as a guest</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = 'display: flex; align-items: center; gap: 12px; padding: 12px 14px; ';
    const dot = (c) => 'width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: ' + c;
    return {
      rows: [
        { cat: 'Slang & Pidgin', answer: '“Japa” means to relocate abroad', ok: true, bad: false, pts: '+180', dot: dot('#8E44AD'), rowStyle: row },
        { cat: 'Food', answer: 'Moi moi is not a swallow', ok: true, bad: false, pts: '+164', dot: dot('#C0392B'), rowStyle: row + 'border-top: 1px solid #EFEADF' },
        { cat: 'Music', answer: 'Burna Boy’s Grammy album was Twice as Tall', ok: false, bad: true, pts: '0', dot: dot('#2980B9'), rowStyle: row + 'border-top: 1px solid #EFEADF' }
      ]
    };
  }
}
</script>
</body>
</html>
