<style>
body{max-width:920px;margin:0 auto;padding:24px 16px;font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#1c1c1c;background:#fffdf7}
h1,h2,h3{color:#006b40}h1{border-top:3px solid #008751;padding-top:24px;margin-top:56px}

#TOC{background:#f2f8f4;padding:12px 20px;border-radius:12px}
</style>
<script type="module">import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";mermaid.initialize({startOnLoad:false});document.querySelectorAll("pre.mermaid").forEach(p=>{const d=document.createElement("div");d.className="mermaid";d.textContent=p.textContent;p.replaceWith(d)});mermaid.run();</script>
